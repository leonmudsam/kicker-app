# Baut src/ zu einer Datei zusammen und veröffentlicht sie auf GitHub Pages.
#
# Solange Pages noch "Deploy from a branch" ist, läuft nur der Job `pruefen`.
# Zum Umschalten sind zwei Handgriffe nötig:
#   1. Settings › Pages › Source: GitHub Actions
#   2. Settings › Secrets and variables › Actions › Variables:
#      PAGES_VIA_ACTIONS = true
# Erst dann übernimmt `veroeffentlichen`. Zurück geht es genauso schnell:
# Variable löschen, Source wieder auf den Branch — index.html liegt weiterhin
# im Wurzelverzeichnis.
#
# Veröffentlicht wird nur aus einem Push auf main oder von Hand, nie aus einem
# Pull Request. Die Bedingung stand allein an `github.ref`, und im Lauf zu
# PR #109 liefen Upload und Veröffentlichen trotzdem — und scheiterten an der
# Schutzregel der Umgebung („refs/pull/109/merge is not allowed to deploy"),
# womit der ganze PR rot dastand, obwohl Bau und Tests grün waren. Das
# Ereignis steht deshalb mit in der Bedingung.

name: Pages

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Eine Reihe je Zweig, nicht eine für alle. Mit der einen Gruppe `pages`
# verdrängte ein Push auf einen Arbeitszweig den wartenden Lauf von `main`:
# am 02.11. wurde der Merge von PR #212 so abgebrochen, bevor er
# veröffentlichte, und keine App konnte die Fassung finden. Auf `main`
# bleibt es eine Reihe: ein Veröffentlichen bricht nie mitten ab, und
# warten zwei, läuft der jüngere — er trägt beide Stände.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pruefen:
    name: Bauen & prüfen
    # Fest auf 24.04: ubuntu-latest wechselt ab dem 19.10.2026 auf Ubuntu 26,
    # und der Browser-Test (`backup`) hängt am Abbild. Umstellen, wenn es
    # geprüft ist — nicht, wenn es passiert.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Zusammensetzen
        run: node tools/build.mjs

      - name: Prüfen
        run: node tools/check.mjs

      - name: Testen
        run: node tests/run.mjs

      # Nicht gestempelt: die Version kommt aus dem Inhalt (build.mjs), und der
      # ist hier derselbe wie im Repository — Wächter 1 lässt nichts anderes
      # durch. Eine Nummer aus der Laufnummer hätte jedem Durchlauf eine neue
      # Version gegeben, auch ohne Änderung: genau das Update, das keines ist.
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_VIA_ACTIONS == 'true'
        with:
          path: dist

  veroeffentlichen:
    name: Veröffentlichen
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_VIA_ACTIONS == 'true'
    needs: pruefen
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
