<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 240" role="img" aria-labelledby="title desc" data-family="schildring" data-level="1">
  <title id="title">Schildring 1</title>
  <desc id="desc">Neu gezeichnete metallisch-violette Rang-Insignie mit mittigem unterem Platzierungsslot.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf7ff"/>
      <stop offset="0.18" stop-color="#a9a2be"/>
      <stop offset="0.42" stop-color="#4a465d"/>
      <stop offset="0.66" stop-color="#ded8e9"/>
      <stop offset="1" stop-color="#5a536f"/>
    </linearGradient>
    <linearGradient id="metalDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#918aa9"/>
      <stop offset="0.5" stop-color="#2a2737"/>
      <stop offset="1" stop-color="#b9afc9"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2d8ff"/>
      <stop offset="0.28" stop-color="#b66cff"/>
      <stop offset="0.62" stop-color="#6c20cd"/>
      <stop offset="1" stop-color="#2a0b68"/>
    </linearGradient>
    <linearGradient id="roseMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0ed"/>
      <stop offset="0.35" stop-color="#bd8f99"/>
      <stop offset="0.7" stop-color="#5d455c"/>
      <stop offset="1" stop-color="#e9b6a8"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3c1"/>
      <stop offset="0.32" stop-color="#d6a45d"/>
      <stop offset="0.65" stop-color="#6b3f30"/>
      <stop offset="1" stop-color="#ffc981"/>
    </linearGradient>
    <radialGradient id="gem" cx="35%" cy="25%" r="78%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.2" stop-color="#dba6ff"/>
      <stop offset="0.62" stop-color="#7a29dd"/>
      <stop offset="1" stop-color="#230847"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g id="shield-wings"><path d="M67 61 Q35 114 67 174 Q53 120 67 61 Z" fill="url(#metal)" stroke="#514764" stroke-width="1.2" opacity="1"/><path d="M189 61 Q221 114 189 174 Q203 120 189 61 Z" fill="url(#metal)" stroke="#514764" stroke-width="1.2" opacity="1"/></g><g id="core-ring">
    <circle cx="128" cy="116" r="70" fill="none" stroke="url(#metalDark)" stroke-width="12" opacity="0.92"/>
    <circle cx="128" cy="116" r="70" fill="none" stroke="url(#metal)" stroke-width="8"/>
    <path d="M76 76 A70 70 0 0 1 176 65" fill="none" stroke="#fff" stroke-width="1.8" opacity="0.64" stroke-linecap="round"/>
    <path d="M83 168 A70 70 0 0 0 173 171" fill="none" stroke="#281d3d" stroke-width="2.2" opacity="0.8" stroke-linecap="round"/>
  </g><g id="top-ornament" filter="url(#glow)"><path d="M121 48 L128 33 L135 48 L128 55 Z" fill="url(#violet)" stroke="url(#metal)" stroke-width="1.4"/><circle cx="128" cy="45" r="2.3" fill="#f7eaff"/></g><g id="placement-slot" data-placement-slot="center-bottom" aria-label="Mittiger unterer Platzierungsslot">
    <rect id="slot-hit-area" x="106" y="179" width="44" height="44" fill="transparent"/>
    <path d="M128 180 L149 201 L128 222 L107 201 Z" fill="#24172e" stroke="url(#metalDark)" stroke-width="5"/>
    <path id="slot-face" d="M128 184 L145 201 L128 218 L111 201 Z" fill="#17131f" stroke="url(#roseMetal)" stroke-width="2.8"/>
    <path d="M116 196 L128 185 L140 196" fill="none" stroke="#fff" stroke-width="1" opacity="0.65"/>
  </g>
</svg>